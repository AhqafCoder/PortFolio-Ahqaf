<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#333" stroke-width="4"/>
  <!-- Stylized "A" letter -->
  <g filter="url(#glow)">
    <path d="M256 80 L380 400 L340 400 L310 320 L202 320 L172 400 L132 400 L256 80 Z M256 160 L218 280 L294 280 L256 160 Z" fill="url(#textGrad)"/>
  </g>
  <!-- Subtle accent line -->
  <line x1="180" y1="360" x2="332" y2="360" stroke="#9ef9ff" stroke-width="3" opacity="0.6"/>
</svg>
