<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="50%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9ef9ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#9ef9ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#9ef9ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Logo/Initial -->
  <g transform="translate(80, 180)">
    <rect width="120" height="120" rx="24" fill="#111" stroke="#333" stroke-width="2"/>
    <path d="M60 25 L95 95 L85 95 L77 78 L43 78 L35 95 L25 95 L60 25 Z M60 42 L48 70 L72 70 L60 42 Z" fill="#fff"/>
    <line x1="35" y1="88" x2="85" y2="88" stroke="#9ef9ff" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Name -->
  <text x="230" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Ahqaf Ali</text>

  <!-- Title -->
  <text x="230" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#888888">Full-Stack Developer &amp; R&amp;D Engineer</text>

  <!-- Separator line -->
  <line x1="80" y1="360" x2="700" y2="360" stroke="#333" stroke-width="1"/>

  <!-- Skills tags -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#666">
    <rect x="80" y="390" width="80" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="120" y="414" text-anchor="middle">React</text>

    <rect x="175" y="390" width="90" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="220" y="414" text-anchor="middle">Next.js</text>

    <rect x="280" y="390" width="85" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="322" y="414" text-anchor="middle">Python</text>

    <rect x="380" y="390" width="50" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="405" y="414" text-anchor="middle">AI</text>

    <rect x="445" y="390" width="90" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="490" y="414" text-anchor="middle">Robotics</text>

    <rect x="550" y="390" width="130" height="36" rx="18" fill="none" stroke="#333" stroke-width="1"/>
    <text x="615" y="414" text-anchor="middle">VTOL Drones</text>
  </g>

  <!-- Stats -->
  <g font-family="system-ui, -apple-system, sans-serif" transform="translate(80, 470)">
    <text x="0" y="0" font-size="36" font-weight="700" fill="#fff">800+</text>
    <text x="0" y="30" font-size="14" fill="#666">Contributions</text>

    <text x="150" y="0" font-size="36" font-weight="700" fill="#fff">3x</text>
    <text x="150" y="30" font-size="14" fill="#666">Hackathon Wins</text>

    <text x="300" y="0" font-size="36" font-weight="700" fill="#fff">15+</text>
    <text x="300" y="30" font-size="14" fill="#666">Projects</text>
  </g>

  <!-- Website URL -->
  <text x="80" y="580" font-family="monospace" font-size="16" fill="#9ef9ff" filter="url(#glow)">ahqafali.dev</text>

  <!-- Right side decorative element -->
  <g transform="translate(900, 150)" opacity="0.15">
    <circle cx="150" cy="150" r="200" fill="none" stroke="#9ef9ff" stroke-width="1"/>
    <circle cx="150" cy="150" r="150" fill="none" stroke="#9ef9ff" stroke-width="1"/>
    <circle cx="150" cy="150" r="100" fill="none" stroke="#9ef9ff" stroke-width="1"/>
    <circle cx="150" cy="150" r="50" fill="none" stroke="#9ef9ff" stroke-width="2"/>
  </g>

  <!-- Accent line bottom -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
